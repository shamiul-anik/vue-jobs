server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Handle Vue Router history mode
    location / {
        try_files $uri $uri/ /index.html;
        # For index.html, we usually want no-cache to ensure users get the latest build
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache static assets (JS, CSS, Images, etc.)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Proxy API requests to the backend container WITH CACHING
    location /api {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Enable API response caching
        proxy_cache api_cache;
        proxy_cache_valid 200 5m;           # Cache successful responses for 5 minutes
        proxy_cache_valid 404 1m;           # Cache 404 responses for 1 minute
        proxy_cache_methods GET HEAD;       # Only cache read operations
        proxy_cache_key "$scheme$request_method$host$request_uri";
        
        # Add cache status header for debugging (HIT/MISS/BYPASS)
        add_header X-Cache-Status $upstream_cache_status always;

        # Bypass cache for authenticated requests (cookie-based auth)
        set $skip_cache 0;
        if ($cookie_token) {
            set $skip_cache 1;
        }
        if ($http_authorization) {
            set $skip_cache 1;
        }
        
        # Bypass cache for POST, PUT, DELETE (write operations)
        if ($request_method !~ ^(GET|HEAD)$) {
            set $skip_cache 1;
        }

        proxy_cache_bypass $skip_cache;
        proxy_no_cache $skip_cache;

        # Invalidate cache when backend sends X-Cache-Invalidate header
        # This happens after POST/PUT/DELETE operations
        proxy_cache_bypass $upstream_http_x_cache_invalidate;
        
        # Short cache revalidation - forces next GET to check freshness
        proxy_cache_revalidate on;
        
        # Use stale cache while revalidating in background (improves UX)
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        
        # Lock prevents multiple simultaneous requests from hitting backend
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
